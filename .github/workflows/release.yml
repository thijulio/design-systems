name: Release

# Publish the @thijulio packages to GitHub Packages on every merge to main that
# touches packages/ (or manually, e.g. for a dry run). Runs `nx release`:
# version (conventional commits) → changelog → git tag → publish the built dist.
# A merge with no releasable commits is a no-op: nx skips publishing when no
# project gets a new version. The release commit is pushed with GITHUB_TOKEN,
# which does not trigger workflows, so it can't re-trigger this one.
# Independent of the Storybook Pages deploy.

on:
  push:
    branches:
      - main
    paths:
      - 'packages/**'
  workflow_dispatch:
    inputs:
      first_release:
        description: 'First release (no previous version tags exist yet)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run — compute versions and pack, but do not push or publish'
        type: boolean
        default: false

# commit version bumps + changelogs and push tags; publish to GitHub Packages.
permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  # Disable husky git hooks: nx release makes an automated version/changelog
  # commit, and the pre-commit hook (format/lint on generated CHANGELOGs) would
  # block it. The same checks already run in the CI workflow on real changes.
  HUSKY: '0'

jobs:
  release:
    name: nx release
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Always release from the tip of main, not the triggering SHA: a run queued
      # behind another release would otherwise start from a commit that is
      # behind that release's version commit and fail to push.
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Packages publish their built dist — build the whole graph first.
      - run: npx nx run-many -t build

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: nx release
        run: |
          npx nx release ${{ inputs.first_release && '--first-release' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} --yes
        env:
          # Repo .npmrc reads _authToken=${NODE_AUTH_TOKEN}; GITHUB_TOKEN carries
          # packages:write for this repo's GitHub Packages registry.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # nx release commits the version bumps + changelogs and tags locally but
      # does not push — send the commit and tags back to main so the repo stays
      # in sync with what was published.
      - name: Push release commit and tags
        if: ${{ !inputs.dry_run }}
        run: git push --follow-tags origin HEAD:main
