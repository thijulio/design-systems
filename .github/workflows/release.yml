name: Release

# Publish the @thijulio packages to GitHub Packages, on demand only. Runs
# `nx release`: version → changelog → git tag → push to main → publish the
# built dist. Publishing comes last so the registry never holds a version
# whose commit/tags didn't reach main. A run with no releasable commits is a
# no-op (no new versions; publish skips versions already in the registry). The
# release commit is pushed with GITHUB_TOKEN, which does not trigger workflows.
# Independent of the Storybook Pages deploy.
#
# Dispatch only, never on merge: a merge used to release whatever the merge
# method's commit message implied (a squash titled `feat:` bumped every
# package by a patch), so the version a package ships is now chosen
# explicitly. Leave `version` empty to derive bumps from conventional commits,
# or pin one (`0.1.0`, `minor`, …) for the `projects` listed. Always dry-run
# first.

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version or bump (0.1.0, patch, minor, major…). Empty: derive from conventional commits'
        type: string
        default: ''
      projects:
        description: 'Comma-separated nx projects to release (e.g. primitives,exodus-react). Empty: all release projects'
        type: string
        default: ''
      first_release:
        description: 'First release (no previous version tags exist yet)'
        type: boolean
        default: false
      dry_run:
        description: 'Dry run — compute versions and pack, but do not push or publish'
        type: boolean
        default: true

# commit version bumps + changelogs and push tags; publish to GitHub Packages.
permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

env:
  NX_DAEMON: 'false'
  # Disable husky git hooks: nx release makes an automated version/changelog
  # commit, and the dev pre-commit hook (`nx format:check`) would block it on
  # the unformatted CHANGELOGs nx writes. The release-only hook configured
  # below formats them instead.
  HUSKY: '0'

jobs:
  release:
    name: nx release
    runs-on: ubuntu-latest
    # Includes the full lint/test/build/typecheck gate below.
    timeout-minutes: 35
    steps:
      # A real (non-dry-run) release pushes to main, so it may only run from
      # main — a dispatch from a branch would fast-forward main to unreviewed
      # commits. Dry runs may target any ref (to preview a branch's versions).
      # The ref reaches the script through env, not an expression spliced into
      # it: a branch name is user-controlled text, never shell source.
      - name: Guard — real releases only from main
        if: ${{ !inputs.dry_run && github.ref != 'refs/heads/main' }}
        env:
          DISPATCH_REF: ${{ github.ref }}
        run: |
          echo "::error::Real releases must be dispatched from main (got ${DISPATCH_REF}). Use dry_run=true to preview a branch."
          exit 1

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # The inputs are free text: check their shape, then hand them to the
      # release commands through env, never spliced into the script.
      - name: Validate inputs
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PROJECTS: ${{ inputs.projects }}
        run: |
          if [[ -n "$RELEASE_VERSION" && ! "$RELEASE_VERSION" =~ ^(major|minor|patch|premajor|preminor|prepatch|prerelease|[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?)$ ]]; then
            echo "::error::version must be a semver bump keyword or an exact version (got: $RELEASE_VERSION)"
            exit 1
          fi
          if [[ -n "$RELEASE_PROJECTS" && ! "$RELEASE_PROJECTS" =~ ^[a-z0-9-]+(,[a-z0-9-]+)*$ ]]; then
            echo "::error::projects must be comma-separated nx project names (got: $RELEASE_PROJECTS)"
            exit 1
          fi

      - uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'npm'

      - run: npm ci

      # Release gate (DS-2): registry versions are immutable, and a dispatch
      # can target a commit CI never finished on, so it cannot rely on CI having
      # passed. Run CI's checks job here — format, then lint/test/build/typecheck
      # (packages publish their built dist, so `build` stays in it) — then the
      # cross-brand --ds-* contract check, all before anything is versioned,
      # pushed or published. CI's Storybook a11y job (`test-storybook`, which
      # needs a Playwright browser) is not repeated: it tests the docs apps,
      # which are not published.
      # `--all`: without NX_BASE/NX_HEAD (no nx-set-shas here) the default
      # compares main with itself and checks nothing.
      - name: format check
        run: npx nx format:check --all

      - name: lint / test / build / typecheck
        run: npx nx run-many -t lint test build typecheck

      - name: Verify the --ds-* contract across brands
        run: npx nx run docs:verify-contract

      # Release-only git hooks: .github/release-hooks/pre-commit formats the
      # files nx release stages (it writes CHANGELOG.md unformatted) so its
      # commit passes the next CI `nx format:check` on main.
      - name: Configure git identity and release hooks
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config core.hooksPath .github/release-hooks

      # Version → changelog → commit → tag, locally. Publishing is a separate
      # step AFTER the push: registry versions are immutable, so we only publish
      # once the version commit + tags are safely on main.
      - name: nx release (version + changelog, no publish)
        env:
          RELEASE_VERSION: ${{ inputs.version }}
          RELEASE_PROJECTS: ${{ inputs.projects }}
        run: |
          args=()
          [[ -n "$RELEASE_VERSION" ]] && args+=("$RELEASE_VERSION")
          [[ -n "$RELEASE_PROJECTS" ]] && args+=("--projects=$RELEASE_PROJECTS")
          npx nx release "${args[@]}" ${{ inputs.first_release && '--first-release' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }} --skip-publish

      # nx release commits and tags locally but does not push. --atomic: the
      # commit and tags land together or not at all. If main moved since
      # checkout (a merge landed), this is rejected and the job stops BEFORE
      # publishing; dispatch again to release from the new tip.
      - name: Push release commit and tags
        if: ${{ !inputs.dry_run }}
        run: git push --atomic --follow-tags origin HEAD:main

      # Publishes every release project whose current version isn't in the
      # registry yet (existing versions are skipped). Also makes a re-run the
      # recovery path if a previous run pushed its tags but failed to publish.
      # Deliberately not filtered by `projects`: versioning also bumps and tags
      # the dependents of the listed projects (biome-react follows primitives),
      # and a filter here would tag versions the registry never gets.
      - name: nx release publish
        run: npx nx release publish ${{ inputs.first_release && '--first-release' || '' }} ${{ inputs.dry_run && '--dry-run' || '' }}
        env:
          # Repo .npmrc reads _authToken=${NODE_AUTH_TOKEN}; GITHUB_TOKEN carries
          # packages:write for this repo's GitHub Packages registry.
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
