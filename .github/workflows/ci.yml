name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# Supersede in-flight runs for the same ref (rapid pushes / PR updates) — the
# newest commit is the one that matters. Cuts private-repo Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Derive NX_BASE/NX_HEAD so `nx affected` only runs the projects touched
      # since the last successful commit — most pushes touch one brand or docs.
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check

      # nx.json sets projectsAffectedByDependencyUpdates: 'auto' so nx release
      # only versions packages whose dependencies really changed. That also
      # narrows `nx affected`, and no project has a graph edge to the toolchain
      # (typescript, jest, eslint, @nx/*) — so any lockfile change runs
      # everything here, as CI did before the setting.
      - name: lint / test / build / typecheck
        run: |
          changed="$(git diff --name-only "$NX_BASE" "$NX_HEAD")"
          if grep -qx 'package-lock.json' <<< "$changed"; then
            npx nx run-many -t lint test build typecheck
          else
            npx nx affected -t lint test build typecheck
          fi

  storybook:
    name: Storybook browser checks
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci
      - run: npx playwright install --with-deps chromium
      # Both targets rebuild the packages consumed through workspace exports,
      # so this job remains valid from a fresh checkout rather than relying on
      # a developer's prebuilt dist folders.
      - run: npx nx build-storybook docs
      - run: npx nx test-storybook docs
      # Web Components catalog (ADR-0001): same gates — build, interaction and
      # a11y tests in a real browser.
      - run: npx nx build-storybook docs-web-components
      - run: npx nx test-storybook docs-web-components

      - name: Upload Storybook on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-artifacts-${{ github.run_id }}
          path: |
            apps/docs/storybook-static
            apps/docs/test-results
            apps/docs-web-components/storybook-static
            apps/docs-web-components/test-results
          if-no-files-found: warn
