name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  actions: read
  contents: read

# Supersede in-flight runs for the same ref (rapid pushes / PR updates) — the
# newest commit is the one that matters. Cuts private-repo Actions minutes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          filter: tree:0
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: 'npm'

      - run: npm ci

      # Derive NX_BASE/NX_HEAD so `nx affected` only runs the projects touched
      # since the last successful commit — most pushes touch one brand or docs.
      - uses: nrwl/nx-set-shas@v4

      - run: npx nx format:check
      - run: npx nx affected -t lint test build typecheck
